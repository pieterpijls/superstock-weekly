name: Superstock Mid-week Alerts

on:
  schedule:
    # Two fixed-UTC slots to straddle US DST (EDT/EST close at different UTC
    # times); run_alerts.py's post-close window picks whichever one is
    # actually ~market-close and skips the other, so exactly one runs.
    - cron: "15 20 * * 1-5"   # ~market close during EDT (US summer)
    - cron: "15 21 * * 1-5"   # ~market close during EST (US winter)
    # Morning flush: if the evening run landed after 23:00 Brussels (data
    # not final yet, or CI delay) it holds the trigger instead of emailing;
    # this picks it up as soon as we're safely past 09:00, any DST regime.
    - cron: "5 8 * * *"       # 09:05 CET / 10:05 CEST - always >= 09:00 local
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass the post-close/quiet-hours gates (manual test)"
        type: boolean
        default: true

permissions:
  contents: write   # commits pending_alert.json when a trigger is held overnight

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for breakout triggers
        env:
          SUPERSTOCK_SMTP_USER: ${{ secrets.SUPERSTOCK_SMTP_USER }}
          SUPERSTOCK_SMTP_PASS: ${{ secrets.SUPERSTOCK_SMTP_PASS }}
        run: python run_alerts.py ${{ inputs.force && '--force' || '' }}

      - name: Persist pending-alert state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pending_alert.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "alerts: pending state $(date -u +%FT%TZ)" && git push)
